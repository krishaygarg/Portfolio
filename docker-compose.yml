version: "3"
services:
  myportfolio:
    container_name: myportfolio
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - FLASK_ENV=development
      - MYSQL_HOST=mysql
      - MYSQL_USER=myportfolio
      - MYSQL_PASSWORD=mypassword
      - MYSQL_DATABASE=myportfoliodb
    ports:
      - "5000:5000"
    volumes:
      - .:/myportfolio
    depends_on:
      - mysql

  mysql:
    container_name: mysql
    image: mariadb
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=myportfolio
      - MYSQL_PASSWORD=mypassword
      - MYSQL_DATABASE=myportfoliodb
      - MYSQL_ROOT_PASSWORD=myrootpassword
    volumes:
      - mydatabase:/var/lib/mysql

volumes:
  mydatabase:
