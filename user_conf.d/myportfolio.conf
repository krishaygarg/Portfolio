map $request_method $limit_post_timeline {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $limit_post_timeline zone=timeline_limit:10m rate=1r/m;

server {
    listen 80;
    server_name krishaygarg.duckdns.org;

    if ($host = krishaygarg.duckdns.org) {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name krishaygarg.duckdns.org;

    resolver 127.0.0.11 valid=30s;
    set $upstream_myportfolio myportfolio:5000;

    location / {
        proxy_pass http://$upstream_myportfolio;
    }

    location /api/timeline_post {
        limit_req zone=timeline_limit;
        proxy_pass http://$upstream_myportfolio/api/timeline_post;
    }

    # Load the certificate files.
    ssl_certificate /etc/letsencrypt/live/myportfolio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myportfolio/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/myportfolio/chain.pem;
}
